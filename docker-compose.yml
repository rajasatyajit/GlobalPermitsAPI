services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: globalpermits
      POSTGRES_USER: globalpermits
      POSTGRES_PASSWORD: globalpermits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalpermits -d globalpermits"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      API_ADDR: ":8080"
      POSTGRES_DSN: "postgres://globalpermits:globalpermits@postgres:5432/globalpermits?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  pgdata:

