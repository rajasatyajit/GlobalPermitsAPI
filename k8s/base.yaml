apiVersion: v1
kind: Namespace
metadata:
  name: globalpermits
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: globalpermits
data:
  API_ADDR: ":8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: globalpermits
stringData:
  POSTGRES_DSN: "postgres://globalpermits:globalpermits@postgres.globalpermits.svc.cluster.local:5432/globalpermits?sslmode=disable"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: globalpermits
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          env:
            - { name: POSTGRES_DB, value: globalpermits }
            - { name: POSTGRES_USER, value: globalpermits }
            - { name: POSTGRES_PASSWORD, value: globalpermits }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: globalpermits
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: globalpermits
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: globalpermits
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: globalpermits
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: globalpermits/api:dev
          ports:
            - containerPort: 8080
          env:
            - name: API_ADDR
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: API_ADDR
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_DSN
            - name: REDIS_ADDR
              value: "redis.globalpermits.svc.cluster.local:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: globalpermits
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api

