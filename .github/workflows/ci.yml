name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Go mod download
        run: go mod download

      - name: Lint (basic build)
        run: |
          go build ./...

      - name: Build API binary
        run: |
          go build -o bin/api ./services/api

      - name: Build loader binary
        run: |
          go build -o bin/loader ./cmd/loader

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/globalpermits-api:latest

      - name: Package Helm chart
        run: |
          tar -czf globalpermits-helm.tgz -C helm globalpermits

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/api
            bin/loader
            globalpermits-helm.tgz

